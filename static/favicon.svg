<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!-- Rear wheel -->
  <circle cx="40" cy="90" r="28" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="40" cy="90" r="20" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- Front wheel -->
  <circle cx="160" cy="90" r="28" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="160" cy="90" r="20" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- Rear suspension/frame -->
  <line x1="40" y1="62" x2="85" y2="45" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Main frame tube -->
  <line x1="85" y1="45" x2="130" y2="50" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Fork to front wheel -->
  <line x1="155" y1="55" x2="160" y2="62" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Front fork -->
  <path d="M 155 55 L 160 85" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 165 55 L 160 85" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Seat -->
  <ellipse cx="105" cy="40" rx="15" ry="8" fill="#1a1a1a"/>
  
  <!-- Handlebars -->
  <path d="M 160 55 Q 165 50 162 45" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Engine block (simple rectangle) -->
  <rect x="90" y="60" width="25" height="20" fill="#1a1a1a" rx="2"/>
</svg>